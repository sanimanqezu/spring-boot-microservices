services:
  eureka-server:
    build:
      context: ./services/EurekaServer
    container_name: eureka-server
    ports:
    - 8761:8761
    healthcheck:
      test:
      - CMD-SHELL
      - curl -sf http://localhost:8761/actuator/health | grep -q UP || exit 1
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s
    networks:
    - portfolio-net
  config-server:
    build:
      context: ./services/ConfigServer
    container_name: config-server
    ports:
    - 7000:7000
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - curl -f http://localhost:7000/actuator/health || exit 1
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
    - portfolio-net
  address-service:
    build:
      context: ./services/Addresses
    container_name: address-service
    ports:
    - 8081:8081
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      SPRING_CLOUD_CONFIG_URI: http://config-server:7000
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:7000
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: inventory_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - curl -f http://localhost:8081/actuator/health || exit 1
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
    - portfolio-net
  product-service:
    build:
      context: ./services/Products
    container_name: product-service
    ports:
    - 8083:8083
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      SPRING_CLOUD_CONFIG_URI: http://config-server:7000
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:7000
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: inventory_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - curl -f http://localhost:8083/actuator/health || exit 1
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
    - portfolio-net
  user-service:
    build:
      context: ./services/Users
    container_name: user-service
    ports:
    - 8084:8084
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      SPRING_CLOUD_CONFIG_URI: http://config-server:7000
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:7000
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: inventory_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    depends_on:
      config-server:
        condition: service_healthy
      address-service:
        condition: service_healthy
    networks:
    - portfolio-net
  order-service:
    build:
      context: ./services/Orders
    container_name: order-service
    ports:
    - 8082:8082
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      SPRING_CLOUD_CONFIG_URI: http://config-server:7000
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:7000
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: inventory_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    depends_on:
      config-server:
        condition: service_healthy
      product-service:
        condition: service_healthy
      user-service:
        condition: service_started
    networks:
    - portfolio-net
  gateway-service:
    build:
      context: ./services/GatewayService
    container_name: gateway-service
    ports:
    - 7002:7002
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      SPRING_CLOUD_CONFIG_URI: http://config-server:7000
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:7000
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
    - portfolio-net
networks:
  portfolio-net:
    external: true
